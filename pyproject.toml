[project]
name = "sftp-everbridge"
version = "0.2.0"
description = "Sync emergency alert registrations from OneDrive to Everbridge SFTP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paramiko>=4.0.0",
    "apscheduler>=3.10.0",
    "msal",
    "requests",
    "pytz",
    "dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
