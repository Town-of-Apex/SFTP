services:
  sftp-uploader:
    build: .
    container_name: sftp-everbridge-scheduler
    restart: unless-stopped
    volumes:
      # Mount the key file and state file as volumes to allow persistence without rebuilding
      - ./Apex.key:/app/Apex.key
      - ./sync_state.json:/app/sync_state.json
      - ./sent_files:/app/sent_files
    environment:
      - TZ=America/New_York
      # Graph API Config (Enter details from IT below)
      - MS_TENANT_ID=ENTER_TENANT_ID_HERE
      - MS_CLIENT_ID=ENTER_CLIENT_ID_HERE
      - MS_CLIENT_SECRET=ENTER_CLIENT_SECRET_HERE
      - MS_DRIVE_ID=ENTER_DRIVE_ID_HERE
      - MS_FILE_PATH=Emergency_Alert_Registrations(in).csv
    # Note: No ports need to be exposed as it's an outbound service.
    # Manual triggers: `docker compose exec sftp-uploader uv run python main.py`
